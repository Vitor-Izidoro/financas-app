<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Controle financeiro pessoal: contas, fixos, parcelamentos e gráficos. Funciona offline.">
  <title>Finanças</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div id="topo-mes" class="topo-mes">
      <button class="btn-icone" data-acao="mes-anterior" aria-label="Mês anterior">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="topo-titulo" data-acao="mes-hoje" id="titulo-mes"></button>
      <button class="btn-icone" data-acao="mes-proximo" aria-label="Próximo mês">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <h1 id="topo-texto" class="topo-texto" hidden></h1>
  </header>

  <main id="view"></main>

  <button class="fab" data-acao="novo-lancamento" aria-label="Novo lançamento">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="abas">
    <button data-aba="inicio" class="ativa">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Início</span>
    </button>
    <button data-aba="graficos">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Gráficos</span>
    </button>
    <button data-aba="planejados">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Planejados</span>
    </button>
    <button data-aba="ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-fundo" data-acao="fechar-sheet"></div>
    <div class="sheet-painel" role="dialog" aria-modal="true">
      <div class="sheet-alca"></div>
      <div id="sheet-corpo"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="arquivo-import" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
